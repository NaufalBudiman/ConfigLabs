# Deploys ConfigLabs to the VPS on every push to main (replaces Vercel's auto-deploy).
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST         the server's IP or host name
#   VPS_SSH_KEY      private key whose public half is in /home/deploy/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <VPS_HOST>   (pins the server key)
# Until VPS_HOST is set, the job does nothing.
name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ]; then echo "VPS_HOST is not set yet, skipping the deploy."; exit 0; fi
          if [ -z "$KNOWN" ]; then echo "Set VPS_KNOWN_HOSTS (ssh-keyscan -t ed25519 $HOST) so the server key is checked."; exit 1; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$HOST" sudo /usr/local/bin/deploy-configlabs
