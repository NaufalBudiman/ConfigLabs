<style>
/* ===== Rack Builder: projects ===== */
:root{--bg:#0b0d10;--bg-2:#111418;--surface:#15191f;--surface-2:#1b2027;--surface-hover:#222831;--border:#232a34;--border-strong:#2e3744;--text:#e6e9ee;--text-dim:#9aa3af;--text-muted:#5b6472;--accent:#7cf4c7;--accent-2:#a8b5ff;--accent-3:#ffb86b;--danger:#ff6478;--success:#7cf4c7;--warning:#ffc857;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.22,1,.36,1)}
[data-theme="light"]{--bg:#f8f6f1;--bg-2:#fff;--surface:#fff;--surface-2:#f1ede3;--surface-hover:#ebe6d8;--border:#e4dfd0;--border-strong:#d0c9b5;--text:#1a1a1a;--text-dim:#5a5a5a;--text-muted:#8a8a8a;--accent:#0f766e;--accent-2:#4f46e5;--accent-3:#ea580c;--danger:#e11d48;--warning:#b7791f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;z-index:60;padding:12px 24px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px;letter-spacing:-.3px;text-decoration:none;color:var(--text)}
.brand-logo{width:32px;height:32px;border-radius:8px;background:conic-gradient(from 180deg,var(--accent),var(--accent-2),var(--accent-3),var(--accent));display:grid;place-items:center;position:relative}
.brand-logo::after{content:'';position:absolute;inset:2px;border-radius:6px;background:var(--bg)}
.brand-logo svg{position:relative;z-index:1;width:18px;height:18px;color:var(--text)}
.brand em{font-family:var(--serif);font-style:italic;color:var(--accent);font-weight:400}
.nav-links{display:flex;gap:2px;flex-wrap:wrap}
.nav-link{padding:8px 14px;color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:500;border-radius:8px;transition:all .2s}
.nav-link:hover{color:var(--text);background:var(--surface)}
.nav-link.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.nav-actions{display:flex;gap:8px;align-items:center}
.chip{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-dim);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease);font-size:15px}
.icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong)}
#app{flex:1;min-height:0;display:grid;grid-template-columns:292px 1fr 324px;position:relative}
.panel{background:var(--bg-2);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;z-index:5}
#right.panel{border-right:none;border-left:1px solid var(--border)}
.panel::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
.sec{padding:16px 18px;border-bottom:1px solid var(--border)}
.sec h4{font-size:10.5px;font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec h4 small{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text-muted);font-weight:400}
.lbl{font-size:11.5px;color:var(--text-dim);margin-bottom:4px;display:block}
select,input[type=text],input[type=number]{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;transition:all .15s var(--ease)}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 8px;border:none;background:none;color:var(--text-dim);font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;font-family:var(--sans);transition:all .15s}
.seg button.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12.5px;color:var(--text-dim);cursor:pointer;user-select:none}
.tgl input{display:none}
.tgl i{width:32px;height:18px;border-radius:99px;background:var(--border-strong);position:relative;transition:background .2s;flex:none}
.tgl i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.tgl input:checked+i{background:var(--accent)}
.tgl input:checked+i::after{transform:translateX(14px)}
.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface-hover);border-color:var(--accent)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0b0d10;border-color:transparent;font-weight:600}
.btn.sm{padding:5px 9px;font-size:11.5px}
.note{font-size:11px;color:var(--text-muted);line-height:1.55;margin-top:8px}
.pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--border-strong);color:var(--text-dim);white-space:nowrap}
.pill.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.pill.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.pill.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.tools{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--border-strong);border-radius:12px;padding:5px;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:6;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
.tools button{background:none;border:none;color:var(--text-dim);min-width:34px;height:32px;padding:0 9px;border-radius:8px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--sans);font-weight:500;transition:all .15s}
.tools button:hover{background:var(--surface-hover);color:var(--text)}
.tools button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tools .sep{width:1px;background:var(--border-strong);margin:5px 3px}
.tools .zl{font-family:var(--mono);font-size:11px;color:var(--text-muted);min-width:44px;text-align:center;align-self:center}
.menu{position:relative}
.menu .dd{position:absolute;top:38px;right:0;min-width:210px;background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:5px;display:none;z-index:9}
.menu.open .dd{display:block}
.dd button{width:100%;justify-content:flex-start;height:auto;padding:8px 10px;text-align:left;white-space:nowrap}
.dd small{display:block;font-size:10.5px;color:var(--text-muted);font-weight:400}
#mini{position:absolute;right:14px;bottom:14px;width:210px;height:140px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:6;cursor:pointer}
#mini svg{width:100%;height:100%;display:block}
#hint{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--text-muted);font-family:var(--mono);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:6px 10px;border-radius:8px;border:1px solid var(--border);z-index:6;pointer-events:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--surface);border:1px solid var(--border-strong);padding:10px 16px;border-radius:999px;font-size:12.5px;z-index:99;transition:transform .3s var(--ease);box-shadow:0 14px 34px rgba(0,0,0,.4)}
#toast.show{transform:translate(-50%,0)}
#printbox{display:none}
body{display:block;overflow:auto;height:auto;min-height:100%}
nav{position:sticky;top:0}
.beta{font:700 9px var(--mono);letter-spacing:1px;padding:2px 6px;border-radius:99px;background:color-mix(in srgb,var(--accent-3) 18%,transparent);color:var(--accent-3);border:1px solid color-mix(in srgb,var(--accent-3) 45%,transparent);margin-left:6px;vertical-align:2px}
a.btn{text-decoration:none}
.bnote{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--text-dim);background:color-mix(in srgb,var(--accent-3) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent-3) 30%,transparent);border-radius:10px;padding:9px 12px;margin-bottom:16px}
.wrap{max-width:1240px;margin:0 auto;padding:34px 24px 80px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hd h1{font-family:var(--serif);font-weight:400;font-size:42px;letter-spacing:-.5px;line-height:1.05}
.hd h1 em{color:var(--accent)}
.hd p{color:var(--text-dim);margin-top:6px;font-size:13.5px}
.hd .acts{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar input[type=text]{max-width:300px;flex:1;min-width:160px}
.bar select{width:auto}
.bar .sp{flex:1}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 10px;border:none;background:none;color:var(--text-dim);font-size:12px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
.seg button.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.dc{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:all .2s var(--ease)}
.dc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.25)}
.dc .th{aspect-ratio:16/10;background:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:16px 16px;display:grid;place-items:center;border-bottom:1px solid var(--border);overflow:hidden}
.dc .th svg{width:100%;height:100%;display:block}
.dc .th .ph{color:var(--text-muted);font-size:12px;font-family:var(--mono)}
.dc .mt{padding:12px 14px 13px}
.dc .mt b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:30px}
.dc .mt span{display:block;font-size:11.5px;color:var(--text-muted);font-family:var(--mono);margin-top:2px}
.dc .mt .ds{font-family:var(--sans);color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{position:absolute;right:8px;bottom:10px;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:none;color:var(--text-dim);cursor:pointer;font-size:18px;line-height:1}
.dots:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text)}
.pop{position:fixed;z-index:80;min-width:170px;background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;box-shadow:0 18px 40px rgba(0,0,0,.4);padding:5px;display:none}
.pop button{display:block;width:100%;text-align:left;padding:8px 10px;background:none;border:none;border-radius:7px;color:var(--text);font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.pop button:hover{background:var(--surface-hover)}
.pop button.dng{color:var(--danger)}
.new{border:2px dashed var(--border-strong);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:230px;color:var(--text-dim);font-size:13px}
.new:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.new i{font-style:normal;font-size:34px;line-height:1;color:var(--accent)}
.list .grid{grid-template-columns:1fr;gap:8px}
.list .dc{display:flex;align-items:center}
.list .dc .th{width:120px;aspect-ratio:16/10;border-bottom:none;border-right:1px solid var(--border);flex:none}
.list .dc .mt{flex:1;min-width:0}
.list .dots{bottom:auto;top:50%;transform:translateY(-50%)}
.list .new{min-height:70px;flex-direction:row}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty h2{font-family:var(--serif);font-weight:400;font-size:34px;color:var(--text);margin-bottom:8px}
.empty h2 em{color:var(--accent)}
.empty .row{justify-content:center;margin-top:16px;flex-wrap:wrap}
.empty .row>*{flex:none}
.foot{margin-top:26px;font-size:11.5px;color:var(--text-muted);font-family:var(--mono)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.md{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;width:min(460px,100%);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.md h3{font-size:18px;margin-bottom:14px;font-weight:600}
.md .fld{margin-bottom:12px}
.md label.l{font-size:11.5px;color:var(--text-dim);display:block;margin-bottom:4px}
.md .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl div{padding:10px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:12.5px;background:var(--bg)}
.tpl div b{display:block;font-size:13px;margin-bottom:2px}
.tpl div span{color:var(--text-muted);font-size:11.5px}
.tpl div.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.drop{position:fixed;inset:0;z-index:95;background:color-mix(in srgb,var(--accent) 12%,rgba(0,0,0,.6));display:none;align-items:center;justify-content:center;font-size:22px;font-family:var(--serif);color:var(--text);pointer-events:none;border:3px dashed var(--accent)}
.drop.on{display:flex}
@media (max-width:1100px){nav{flex-wrap:wrap;padding:8px 14px}.nav-links{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:0}.nav-link{padding:6px 10px;white-space:nowrap}.nav-link svg{display:none}}
@media (max-width:640px){.wrap{padding:22px 16px 60px}.hd h1{font-size:32px}.grid{grid-template-columns:1fr 1fr;gap:10px}.chip{display:none}}
/* ===== Rack editor ===== */
html,body{height:100%}body{display:flex;flex-direction:column;overflow:hidden;min-height:0}nav{position:relative}
#app{grid-template-columns:304px minmax(0,1fr) 344px}
#stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#docbar{flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--border)}
#docbar .btn,#docbar .seg button{white-space:nowrap}#docbar input{width:auto;flex:0 1 260px;min-width:120px;background:transparent;border-color:transparent;font-family:var(--sans);font-size:14px;font-weight:600}
#docbar input:hover{border-color:var(--border)}#docbar input:focus{background:var(--bg)}
#docbar .sp{flex:1}#sv{font:11px var(--mono);color:var(--text-muted);white-space:nowrap}
#rtabs{flex:none;display:flex;gap:4px;padding:8px 14px 0;background:var(--bg-2);border-bottom:1px solid var(--border);overflow-x:auto;align-items:flex-end}
#rtabs button{padding:7px 14px;border:1px solid var(--border);border-bottom:none;border-radius:9px 9px 0 0;background:var(--bg);color:var(--text-dim);font:500 12.5px var(--sans);cursor:pointer;white-space:nowrap}
#rtabs button.on{background:var(--surface);color:var(--accent);border-color:var(--border-strong);position:relative;top:1px}
#rtabs .add{color:var(--accent);border-style:dashed}
#bar2,#bar3{flex:none;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--bg-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
#bar2 .zl,#bar3 .zl{font:11px var(--mono);color:var(--text-muted);min-width:42px;text-align:center}
#bar2 .sp,#bar3 .sp{flex:1}
#cv{flex:1;min-height:0;overflow:auto;display:flex;padding:20px;background:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:18px 18px;touch-action:pan-x pan-y}
#cv svg{margin:auto;display:block;flex:none;user-select:none;-webkit-user-select:none}
#cv svg [data-dev]{cursor:grab}
#stat{flex:none;display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:7px 14px;border-top:1px solid var(--border);background:var(--bg-2);font:11.5px var(--mono);color:var(--text-dim)}
#stat b{color:var(--text);font-weight:600}#stat .sp{flex:1}
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-2);z-index:2;flex:none}
.tabs button{flex:1;padding:11px 6px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font:500 12.5px var(--sans);cursor:pointer;position:relative}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{font:700 9.5px var(--mono);background:var(--danger);color:#fff;border-radius:99px;padding:1px 5px;margin-left:4px}
.tabs .n.w{background:var(--warning);color:#1a1a1a}
.grp{font:600 10.5px var(--mono);letter-spacing:1.1px;text-transform:uppercase;color:var(--text-muted);padding:12px 18px 6px;display:flex;justify-content:space-between}
.mi{position:relative;margin:0 12px 6px;padding:9px 38px 9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:grab;touch-action:none;user-select:none}
.mi:hover{border-color:var(--accent);background:var(--surface-hover)}
.mi .t{display:flex;gap:6px;align-items:center;justify-content:space-between}.mi b{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .s{font:10.5px var(--mono);color:var(--text-muted);margin-top:2px}
.mi .add{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:7px;border:1px solid var(--border-strong);background:var(--bg);color:var(--accent);cursor:pointer;font-size:16px;line-height:1}
.mi .cx{position:absolute;right:38px;bottom:5px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:2px 4px}.mi .cx:hover{color:var(--danger)}
.mi .add:hover{background:var(--accent);color:#0b0d10}

<script>
'use strict';
const $ = id => document.getElementById(id), esc = RR.esc, UMM = RK.UMM;
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let _tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2800); }
const qs = new URLSearchParams(location.search), PID = /^[\w.\-]{1,60}$/.test(qs.get('p') || '') ? qs.get('p') : '';
const S = { P: null, rackId: null, face: 'front', sel: null, zoom: 1, gaps: true, tabL: 'lib', tabR: 'dev', q: '', vendor: 'all', undo: [], redo: [], geo: null, drag: null, issues: [] };
const pal = () => document.body.dataset.theme === 'light' ? 'light' : 'dark';
const rack = () => RC.rack(S.P, S.rackId) || S.P.racks[0];
const selDev = () => S.sel ? RC.dev(S.P, S.sel) : null;
const num = (v, d, lo, hi) => { v = parseFloat(v); if (!isFinite(v)) v = d; return Math.min(hi, Math.max(lo, v)); };
const imp = () => S.P.settings.units === 'imperial';
const fKg = v => imp() ? (v * 2.20462).toFixed(1) + ' lb' : (+v.toFixed(1)) + ' kg';
const fLen = v => imp() ? (v / 25.4).toFixed(1) + ' in' : Math.round(v) + ' mm';
const fW = v => v >= 10000 ? (v / 1000).toFixed(1) + ' kW' : Math.round(v) + ' W';

/* ---------- load / save ---------- */
function load() {
  let P = null; try { P = RC.cleanProject(JSON.parse(ls.get('cl_rk_d_' + PID))); } catch (e) {}
  if (!PID || !P) { document.getElementById('app').innerHTML = '<div class="empt" style="grid-column:1/-1;padding:80px 20px"><h2 style="font-family:var(--serif);font-weight:400;font-size:34px;margin-bottom:8px">Project not found</h2><p>It may have been deleted, or it was saved in a different browser.</p><p style="margin-top:14px"><a class="btn pri" href="/rack.html">Back to projects</a></p></div>'; return false; }
  S.P = P; S.rackId = P.racks[0].id; return true;
}
let _sv; function touch() { $('sv').textContent = 'Saving…'; clearTimeout(_sv); _sv = setTimeout(save, 350); }
function save() {
  const P = S.P, used = {}; P.devices.forEach(d => used[d.modelId] = 1); Object.keys(P.models).forEach(k => { if (!used[k]) delete P.models[k]; });
  if (!ls.set('cl_rk_d_' + PID, JSON.stringify(P))) { $('sv').textContent = 'Not saved'; toast('Browser storage is full or blocked: export a file now so you do not lose work'); return; }
  let a = []; try { a = JSON.parse(ls.get('cl_rk_idx') || '[]'); } catch (e) {} if (!Array.isArray(a)) a = [];
  const x = a.find(y => y && y.id === PID); if (x) { x.name = P.name; x.desc = P.site || x.desc || ''; x.updated = Date.now(); x.n = P.racks.length; x.d = P.devices.length; ls.set('cl_rk_idx', JSON.stringify(a)); }
  $('sv').textContent = 'Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
addEventListener('beforeunload', () => { if (S.P) save(); });
function mutate(fn, keep) {
  if (!keep) { S.undo.push(JSON.stringify(S.P)); if (S.undo.length > 80) S.undo.shift(); S.redo = []; }
  fn(); const c = RC.cleanProject(S.P); if (c) S.P = c;
  if (!RC.rack(S.P, S.rackId)) S.rackId = S.P.racks[0].id; if (S.sel && !RC.dev(S.P, S.sel)) S.sel = null;
  touch(); render();
}
function undo(redo) {
  const from = redo ? S.redo : S.undo, to = redo ? S.undo : S.redo; if (!from.length) return;
  to.push(JSON.stringify(S.P)); const c = RC.cleanProject(JSON.parse(from.pop())); if (!c) return; S.P = c;
  if (!RC.rack(S.P, S.rackId)) S.rackId = S.P.racks[0].id; if (S.sel && !RC.dev(S.P, S.sel)) S.sel = null; touch(); render();
}

/* ---------- keep the DOM stable when panels refresh (so a click is never lost to a re-render) ---------- */
function morph(el, html) { const t = document.createElement('div'); t.innerHTML = html; mSync(el, t); }
function mSync(a, b) {
  const bc = [...b.childNodes];
  bc.forEach((y, i) => {
    const x = a.childNodes[i];
    if (!x) { a.appendChild(y.cloneNode(true)); return; }
    if (x.nodeType !== y.nodeType || (x.nodeType === 1 && x.tagName !== y.tagName)) { a.replaceChild(y.cloneNode(true), x); return; }
    if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
    [...x.attributes].forEach(at => { if (!y.hasAttribute(at.name)) x.removeAttribute(at.name); });
    [...y.attributes].forEach(at => { if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value); });
    const tg = x.tagName;
    if (tg === 'INPUT') { if (x.type === 'checkbox') x.checked = y.hasAttribute('checked'); else { const v = y.getAttribute('value') || ''; if (x.value !== v) x.value = v; } }
    else if (tg === 'TEXTAREA') { if (x.value !== y.textContent) x.value = y.textContent; }
    else { mSync(x, y); if (tg === 'SELECT') x.selectedIndex = Math.max(0, [...y.options].findIndex(o => o.hasAttribute('selected'))); }
  });
  while (a.childNodes.length > bc.length) a.removeChild(a.lastChild);
}

/* ---------- rendering ---------- */
function render() { S.issues = RC.validate(S.P); renderTabs(); renderCanvas(); renderLeft(); renderRight(); S.mode === 'room' ? statRoom() : renderStat(); $('docname').value !== S.P.name && document.activeElement !== $('docname') && ($('docname').value = S.P.name); $('b-undo').disabled = !S.undo.length; $('b-redo').disabled = !S.redo.length; }
function renderTabs() {
  $('rtabs').innerHTML = S.P.racks.map(r => `<button data-r="${esc(r.id)}" title="Double-click to rename" class="${r.id === S.rackId ? 'on' : ''}">${esc(r.label)} <small style="color:var(--text-muted)">${r.u}U${RC.summary(S.P, r.id).servers ? ' · ' + RC.summary(S.P, r.id).servers + ' srv' : ''}</small></button>`).join('') + '<button class="add" data-add="1" title="Add a rack">+ Rack</button>';
  document.querySelectorAll('#faceseg button').forEach(b => b.classList.toggle('on', b.dataset.f === S.face));
}
function renderCanvas() {
  if (S.mode === 'room') return renderRoom();
  const r = rack(), o = RR.rackSVG(S.P, r.id, { face: S.face, sel: S.sel, pal: pal(), gaps: S.gaps, pid: 'c' }); S.geo = o;
  $('cv').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" id="rsvg" width="${Math.round(o.w * S.zoom)}" height="${Math.round(o.h * S.zoom)}" viewBox="0 0 ${o.w} ${o.h}">${o.svg}<g id="gh" pointer-events="none"></g></svg>`;
  $('zl').textContent = Math.round(S.zoom * 100) + '%';
}
function fit(strict) { if (S.mode === 'room') return fitRoom(); const r = rack(), h = r.u * UMM + 60; let z = Math.min(2.5, ($('cv').clientHeight - 44) / h); S.zoom = Math.max(strict ? 0.2 : 0.55, z); renderCanvas(); }
function renderStat() {
  const r = rack(), st = RC.stats(S.P, r), live = S.issues.filter(i => !i.ack), c = live.filter(i => i.sev === 'crit').length, w = live.filter(i => i.sev === 'warn').length;
  $('stat').innerHTML = `<span>${esc(r.label)}</span><span>Space <b>${st.usedU}/${r.u}U</b> (${st.pct}%)</span><span>Power <b>${fW(st.watts)}</b></span><span>Weight <b>${fKg(st.kg)}</b></span><span class="sp"></span><span>${c ? '<b style="color:var(--danger)">' + c + ' critical</b> · ' : ''}${w ? '<b style="color:var(--warning)">' + w + ' warnings</b>' : (c ? '' : '<b style="color:var(--accent)">No problems found</b>')}</span>`;
}
const verPill = m => `<span class="pill ${m.ver === 'datasheet' ? 'ok' : m.ver === 'typical' ? 'warn' : ''}" title="${esc(m.ver === 'typical' ? 'Placeholder values: check against the datasheet' : m.ver === 'partial' ? 'Some values are estimates' : 'Values from the vendor datasheet or hardware guide')}">${esc(RK.VER[m.ver])}</span>`;
function modelLine(m) { const w = S.P.settings.powerBasis === 'typ' && m.w.typ != null ? m.w.typ : m.w.max; return [m.vendor, m.u + 'U', fLen(m.d), m.cat === 'blank' ? '' : (w ? fW(w) : '')].filter(Boolean).join(' · '); }

/* ---------- left panel ---------- */
function renderLeft() {
  if (S.mode === 'room') { morph($('left'), leftRoom()); return; }
  const L = $('left'); const keepQ = document.activeElement && document.activeElement.id === 'lq';
  let h = `<div class="tabs"><button data-tl="lib" class="${S.tabL === 'lib' ? 'on' : ''}">Equipment</button><button data-tl="rack" class="${S.tabL === 'rack' ? 'on' : ''}">Rack &amp; project</button></div>`;
  if (S.tabL === 'lib') {
    const all = RK.all(), vs = [...new Set(all.map(m => m.vendor || 'Generic'))];
    h += `<div class="sec"><input type="text" id="lq" placeholder="Search equipment" value="${esc(S.q)}" autocomplete="off"><div class="row" style="margin-top:8px"><select id="lv"><option value="all">All vendors</option>${vs.map(v => `<option${v === S.vendor ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select><button class="btn sm" id="b-cust">+ Custom device</button></div><p class="note">Drag into the rack, or press + to add at the first free slot. <b>Typical</b> means a placeholder value: check it against your datasheet.</p></div>`;
    const q = S.q.trim().toLowerCase(), f = all.filter(m => (S.vendor === 'all' || (m.vendor || 'Generic') === S.vendor) && (!q || (m.vendor + ' ' + m.name + ' ' + RK.CATS[m.cat]).toLowerCase().includes(q)));
    RK.GROUPS.forEach(g => { const it = f.filter(m => g[2].indexOf(m.cat) >= 0); if (!it.length) return; h += `<div class="grp"><span>${esc(g[1])}</span><span>${it.length}</span></div>` + it.map(m => `<div class="mi" data-m="${esc(m.id)}"><div class="t"><b>${esc((m.vendor ? m.vendor + ' ' : '') + m.name)}</b>${verPill(m)}</div><div class="s">${esc(modelLine(m))}</div>${m.custom ? `<button class="cx" data-cdel="${esc(m.id)}" title="Delete from my library">✕</button>` : ''}<button class="add" data-add="${esc(m.id)}" title="Add to rack">+</button></div>`).join(''); });
    if (!f.length) h += '<div class="empt">Nothing matches. Clear the search, or add a custom device.</div>';
    h += '<div style="height:20px"></div>';
  } else {
    const r = rack(), P = S.P, s = P.settings, o = (v, a) => a.map(x => `<option value="${esc(x[0])}"${String(x[0]) === String(v) ? ' selected' : ''}>${esc(x[1])}</option>`).join('');
    h += `<div class="sec"><h4>${esc(r.label)}</h4><div class="row" style="margin-bottom:10px"><button class="btn sm" id="b-rtype">Browse rack types…</button></div><div class="f"><label class="lbl">Rack name</label><input type="text" data-rk="label" value="${esc(r.label)}" maxlength="40"></div>
<div class="f2"><div class="f"><label class="lbl">Height (U)</label><select data-rk="u">${o(r.u, Array.from({ length: 60 }, (_, i) => [i + 1, (i + 1) + 'U' + (RK.PRESETS_U.indexOf(i + 1) >= 0 ? ' (common)' : '')]))}</select></div><div class="f"><label class="lbl">Numbering</label><select data-rk="numbering">${o(r.numbering, [['bottom-up', 'U1 at bottom'], ['top-down', 'U1 at top']])}</select></div>
<div class="f"><label class="lbl">Width (mm)</label><select data-rk="w">${o(r.w, [[482, '482 (open frame)'], [600, '600'], [700, '700'], [750, '750'], [800, '800']])}</select></div><div class="f"><label class="lbl">Depth (mm)</label><input type="text" inputmode="numeric" data-rk="d" value="${r.d}"></div>

/* ---------- right panel ---------- */

function sumPanel() {

<div class="sec"><h4>${esc(r.label)} · power <small>${s.powerBasis === 'max' ? 'maximum watts' : 'typical watts'}</small></h4>${feed('A')}${feed('B')}
<div class="kv" style="margin-top:8px">Total <b>${fW(st.watts)}</b> · ${(st.watts * 3.412).toFixed(0)} BTU/h of heat to remove${st.feed.none ? `<br><span style="color:var(--warning)">${fW(st.feed.none)} is not assigned to any feed</span>` : ''}</div>
${both ? `<div class="kv" style="margin-top:8px">If feed A fails: B carries <b>${fW(lb)}</b> (${Math.round(lb / r.pdus.B.cap * 100)}%)<br>If feed B fails: A carries <b>${fW(la)}</b> (${Math.round(la / r.pdus.A.cap * 100)}%)</div>` : '<p class="note">Set both feed capacities under Rack &amp; project to check what happens when one feed is lost.</p>'}</div>

/* ---------- editing actions ---------- */
function snapModel(m) { if (!S.P.models[m.id]) { const c = JSON.parse(JSON.stringify(m)); delete c.custom; S.P.models[m.id] = c; } }
const blankDev = (rackId, modelId, u) => ({ id: RC.uid('d'), rackId, modelId, u, side: 'full', rev: false, hostname: '', role: '', ips: [], mgmtIp: '', vlan: '', serial: '', asset: '', status: 'planned', feeds: [], notes: '' });
function addDevice(modelId, u) {
  const m = RK.find(modelId, S.P); if (!m) return; const r = rack(); let at = u;
  if (at == null) { at = null; for (let row = 0; row < r.u; row++) { const c = RR.uFromRow(r, row, m.u); if (RC.fits(S.P, r, c, m.u) && !RC.collides(S.P, r.id, null, c, m.u, 'full')) { at = c; break; } } }
  if (at == null) return toast('No free ' + m.u + 'U slot left in ' + r.label);
  const id = RC.uid('d');
  mutate(() => { snapModel(m); const d = blankDev(r.id, m.id, at); d.id = id; if (m.psu > 0) d.feeds = ['A', 'B'].filter((f, i) => i < Math.min(2, m.psu) && r.pdus[f].cap > 0); S.P.devices.push(d); S.sel = id; S.tabR = 'dev'; });
}
function delDevice(id) { mutate(() => { S.P.devices = S.P.devices.filter(d => d.id !== id); S.sel = null; }); }
function dupDevice(id) {
  const d = RC.dev(S.P, id); if (!d) return; const r = RC.rack(S.P, d.rackId), h = RC.h(S.P, d), u = RC.nearestFree(S.P, r, null, d.u + h, h, d.side); if (u == null) return toast('No room to duplicate here');
  const n = JSON.parse(JSON.stringify(d)); n.id = RC.uid('d'); n.u = u; n.hostname = ''; n.serial = ''; n.asset = ''; n.mgmtIp = ''; n.ips = []; mutate(() => { S.P.devices.push(n); S.sel = n.id; });
}
function moveSel(delta) { const d = selDev(); if (!d) return; const r = RC.rack(S.P, d.rackId), h = RC.h(S.P, d), u = d.u + delta; if (!RC.fits(S.P, r, u, h) || RC.collides(S.P, r.id, d.id, u, h, d.side)) return; mutate(() => { d.u = u; }); }

/* ---------- drag and drop (pointer events) ---------- */
function slotAt(cx, cy, h, offMm, ex, side) {
  const svg = $('rsvg'); if (!svg || !S.geo) return null; const b = svg.getBoundingClientRect();
  if (cx < b.left - 40 || cx > b.right + 40 || cy < b.top - 40 || cy > b.bottom + 40) return null;
  const r = rack(), y = (cy - b.top) / S.zoom - offMm + h * UMM / 2; let u = RR.uFromRow(r, RR.rowOf(r, y, S.geo.topY, h), h); u = Math.max(1, Math.min(r.u - h + 1, u));
  return { u, h, ok: !RC.collides(S.P, r.id, ex, u, h, side || 'full') };
}
function setGhost(s) {
  const g = $('gh'); if (!g) return; if (!s) { g.innerHTML = ''; return; } const p = RR.pal(pal()), c = s.ok ? p.acc : p.bad, y = RR.slotTop(rack(), s.u, s.h, S.geo.topY);
  g.innerHTML = `<rect x="${S.geo.x0}" y="${y}" width="${RK.RACKW}" height="${s.h * UMM}" rx="2" fill="${c}" fill-opacity=".24" stroke="${c}" stroke-width="2.4" stroke-dasharray="8 5"/><text x="${S.geo.x0 + 18}" y="${y + s.h * UMM / 2 + 4}" font-family="JetBrains Mono,monospace" font-size="12" font-weight="700" fill="${c}">U${s.u}${s.h > 1 ? '–' + (s.u + s.h - 1) : ''}${s.ok ? '' : ' · occupied'}</text>`;
}
function startDrag(kind, o, e) {
  const sx = e.clientX, sy = e.clientY; let on = false, slot = null;
  const chip = $('chip');
  const mv = ev => {
    if (!on) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return; on = true; S.drag = o; chip.textContent = o.label; chip.style.display = 'block'; document.body.style.cursor = 'grabbing'; if (kind === 'move') { const el = document.querySelector('#rsvg [data-dev="' + CSS.escape(o.id) + '"]'); if (el) el.setAttribute('opacity', '.3'); } }
    chip.style.left = (ev.clientX + 14) + 'px'; chip.style.top = (ev.clientY + 12) + 'px';
    slot = slotAt(ev.clientX, ev.clientY, o.h, o.off, kind === 'move' ? o.id : null, o.side); setGhost(slot);
  };
  const up = ev => {
    removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); chip.style.display = 'none'; document.body.style.cursor = ''; S.drag = null; setGhost(null);
    if (!on) { if (kind === 'move') { /* plain click: already selected */ } return; }
    if (ev.type === 'pointercancel') return render(); if (!slot) return render();
    if (!slot.ok) { toast('That slot is taken'); return render(); }
    if (kind === 'new') addDevice(o.modelId, slot.u); else { const d = RC.dev(S.P, o.id); if (d && d.u !== slot.u) mutate(() => { d.u = slot.u; }); else render(); }
  };
  addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
}
$('left').addEventListener('pointerdown', e => {
  const mi = e.target.closest('.mi'); if (!mi || e.target.closest('.add') || e.button) return; const m = RK.find(mi.dataset.m, S.P); if (!m) return;
  startDrag('new', { modelId: m.id, h: m.u, off: m.u * UMM / 2, label: (m.vendor ? m.vendor + ' ' : '') + m.name + ' · ' + m.u + 'U' }, e);
});
$('cv').addEventListener('pointerdown', e => {
  if (S.mode === 'room') return roomDown(e);
  if (e.button) return; const g = e.target.closest('[data-dev]');
  if (!g) { if (S.sel) { S.sel = null; render(); } return; }
  const id = g.dataset.dev, d = RC.dev(S.P, id); if (!d) return; const svg = $('rsvg'), b = svg.getBoundingClientRect(), h = RC.h(S.P, d), top = RR.slotTop(rack(), d.u, h, S.geo.topY), off = (e.clientY - b.top) / S.zoom - top;
  const was = S.sel === id; if (!was) { S.sel = id; S.tabR = 'dev'; render(); }
  startDrag('move', { id, h, off, side: d.side, label: d.hostname || RC.model(S.P, d.modelId).name }, e);
});

/* ---------- events ---------- */
$('left').addEventListener('click', e => {
  const t = e.target.closest('[data-tl]'); if (t) { S.tabL = t.dataset.tl; return renderLeft(); }
  const a = e.target.closest('[data-add]'); if (a) return addDevice(a.dataset.add);
  if (e.target.closest('#b-cust')) return customDlg();
  const ra = e.target.closest('[data-ra]'); if (ra) { if (ra.dataset.ra === 'dup') dupRack(); else delRack(); }
});
$('left').addEventListener('input', e => { if (e.target.id === 'lq') { S.q = e.target.value; renderLeft(); } });
