# ConfigLabs (configlabs.online): static pages from the repo, the Flask API through gunicorn.
# Same behaviour as vercel.json: rewrites to the API, redirects, security headers.
# certbot --nginx adds the HTTPS server and the http -> https redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name configlabs.online www.configlabs.online;

    root /srv/configlabs;
    index index.html;
    client_max_body_size 3m;          # Flask caps requests at 2 MB
    absolute_redirect off;            # short-link redirects stay relative (correct behind HTTPS)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($host = www.configlabs.online) { return 301 $scheme://configlabs.online$request_uri; }

    # short links (vercel.json redirects)
    location = /about      { return 302 /about.html; }
    location = /translator { return 302 /translate.html; }
    location = /dashboard  { return 302 /dashboard.html; }
    location = /builder    { return 302 /builder.html; }
    location = /wifi       { return 302 /wifi.html; }
    location = /topology   { return 302 /topology.html; }
    location = /rack       { return 302 /rack.html; }
    location = /solutions-showcase-v3.html { return 302 /; }

    # Flask (vercel.json rewrites)
    location ~ ^/(api|auth)/ { include /etc/nginx/snippets/configlabs-proxy.conf; }
    location ~ ^/(templates|generate|vendors|feedback)$ { include /etc/nginx/snippets/configlabs-proxy.conf; }

    # the site itself: only web files are served, never the Python, git or server files
    location = / { try_files /index.html =404; }
    location = /requirements.txt { return 404; }
    location ~* \.(html|js|css|svg|png|ico|jpg|jpeg|webp|webmanifest|xml|txt|woff2?)$ { try_files $uri =404; }
    location / { return 404; }
}
