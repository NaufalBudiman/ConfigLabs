# RackTrack (racktrack.online): Next.js (next start on 127.0.0.1:3000).
# certbot --nginx adds the HTTPS server and the http -> https redirect to this file.
map $http_upgrade $racktrack_connection {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    listen [::]:80;
    server_name racktrack.online www.racktrack.online;
    client_max_body_size 25m;         # spreadsheet imports and photo scans

    if ($host = www.racktrack.online) { return 301 $scheme://racktrack.online$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $racktrack_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
